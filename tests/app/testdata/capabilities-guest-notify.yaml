# The notify suite's capabilities: the tests' own (testdata/capabilities.yaml)
# with notifications open to guests, so the suite can test how mail works
# without signing every request in. That notifications are for accounts by
# default, and what that means, is tested with the real defaults
# (notify_accounts_test.go).
classes:
  guest:  [play, join, create_game, chat_game, voice_game, notify]
  user:   [play, join, create_game, chat_game, chat_global, voice_game,
           voice_direct, dm, notify, run_batch]
limits:
  guest:  { chat: 100000, create_game: 100000, login: 100000 }
  user:   { chat: 100000, create_game: 100000, dm: 100000 }
