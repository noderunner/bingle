# How the web page draws Tricks (tests/testdata/tricks, ADR 0124), and its page
# script and stylesheet: the tests' vehicle for a board of choices drawn in
# pictures and players with pictures of their own.
board:
  style: none
pieces:
  token: {shape: disc}
