<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-label="The four steps of Monte Carlo tree search" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><rect width="720" height="300" rx="10" fill="#f7f0df"/><rect x="30" y="70" width="150" height="120" rx="10" fill="#f7f0df" stroke="#2b2118" stroke-width="2"/><circle cx="52" cy="92" r="13" fill="#4a7fd6" stroke="#2b2118" stroke-width="1.5"/><text x="52" y="92" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600" dominant-baseline="central">1</text><text x="115" y="92" font-size="15" fill="#2b2118" text-anchor="middle" font-weight="600" dominant-baseline="central">Select</text><text x="105" y="122" font-size="12" fill="#6b6155" text-anchor="middle" font-weight="400" dominant-baseline="central">walk down the tree,</text><text x="105" y="140" font-size="12" fill="#6b6155" text-anchor="middle" font-weight="400" dominant-baseline="central">favouring what looks good</text><text x="105" y="158" font-size="12" fill="#6b6155" text-anchor="middle" font-weight="400" dominant-baseline="central">and what is untried</text><line x1="186" y1="130" x2="207.6" y2="130" stroke="#2b2118" stroke-width="2.5" stroke-linecap="round"/><polygon points="214,130 206.8,133.5 206.8,126.5" fill="#2b2118" stroke="#2b2118" stroke-width="1" stroke-linejoin="round"/><rect x="220" y="70" width="150" height="120" rx="10" fill="#f7f0df" stroke="#2b2118" stroke-width="2"/><circle cx="242" cy="92" r="13" fill="#4a7fd6" stroke="#2b2118" stroke-width="1.5"/><text x="242" y="92" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600" dominant-baseline="central">2</text><text x="305" y="92" font-size="15" fill="#2b2118" text-anchor="middle" font-weight="600" dominant-baseline="central">Expand</text><text x="295" y="122" font-size="12" fill="#6b6155" text-anchor="middle" font-weight="400" dominant-baseline="central">add one new move</text><text x="295" y="140" font-size="12" fill="#6b6155" text-anchor="middle" font-weight="400" dominant-baseline="central">to the tree</text><line x1="376" y1="130" x2="397.6" y2="130" stroke="#2b2118" stroke-width="2.5" stroke-linecap="round"/><polygon points="404,130 396.8,133.5 396.8,126.5" fill="#2b2118" stroke="#2b2118" stroke-width="1" stroke-linejoin="round"/><rect x="410" y="70" width="150" height="120" rx="10" fill="#f7f0df" stroke="#2b2118" stroke-width="2"/><circle cx="432" cy="92" r="13" fill="#4a7fd6" stroke="#2b2118" stroke-width="1.5"/><text x="432" y="92" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600" dominant-baseline="central">3</text><text x="495" y="92" font-size="15" fill="#2b2118" text-anchor="middle" font-weight="600" dominant-baseline="central">Play out</text><text x="485" y="122" font-size="12" fill="#6b6155" text-anchor="middle" font-weight="400" dominant-baseline="central">finish the game</text><text x="485" y="140" font-size="12" fill="#6b6155" text-anchor="middle" font-weight="400" dominant-baseline="central">by random moves</text><line x1="566" y1="130" x2="587.6" y2="130" stroke="#2b2118" stroke-width="2.5" stroke-linecap="round"/><polygon points="594,130 586.8,133.5 586.8,126.5" fill="#2b2118" stroke="#2b2118" stroke-width="1" stroke-linejoin="round"/><rect x="600" y="70" width="150" height="120" rx="10" fill="#f7f0df" stroke="#2b2118" stroke-width="2"/><circle cx="622" cy="92" r="13" fill="#4a7fd6" stroke="#2b2118" stroke-width="1.5"/><text x="622" y="92" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600" dominant-baseline="central">4</text><text x="685" y="92" font-size="15" fill="#2b2118" text-anchor="middle" font-weight="600" dominant-baseline="central">Back up</text><text x="675" y="122" font-size="12" fill="#6b6155" text-anchor="middle" font-weight="400" dominant-baseline="central">add the result to every</text><text x="675" y="140" font-size="12" fill="#6b6155" text-anchor="middle" font-weight="400" dominant-baseline="central">node on the way home</text><path d="M 105 196 C 105 250, 675 250, 675 196" fill="none" stroke="#2b2118" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="135" y1="228" x2="109.5" y2="202.5" stroke="#2b2118" stroke-width="2.5" stroke-linecap="round"/><polygon points="105,198 112.6,200.6 107.6,205.6" fill="#2b2118" stroke="#2b2118" stroke-width="1" stroke-linejoin="round"/><text x="360" y="258" font-size="13" fill="#6b6155" text-anchor="middle" font-weight="600" dominant-baseline="central">Thousands of times a move; the move tried most often is the one played.</text><text x="360" y="36" font-size="15" fill="#2b2118" text-anchor="middle" font-weight="600" dominant-baseline="central">One iteration</text></svg>
