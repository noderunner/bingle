<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-label="How far each bot looks, and what it knows" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><rect width="720" height="300" rx="10" fill="#f7f0df"/><text x="108" y="71" font-size="14" fill="#2b2118" text-anchor="end" font-weight="600" dominant-baseline="central">random</text><rect x="120" y="60" width="470" height="22" rx="11" fill="#efe9dc"/><rect x="120" y="60" width="28.2" height="22" rx="11" fill="#b9b1a4" stroke="#2b2118" stroke-width="1.2"/><text x="124" y="100" font-size="12" fill="#6b6155" text-anchor="start" font-weight="400" dominant-baseline="central">no idea at all: the baseline every other bot is measured against</text><text x="108" y="129" font-size="14" fill="#2b2118" text-anchor="end" font-weight="600" dominant-baseline="central">tactical</text><rect x="120" y="118" width="470" height="22" rx="11" fill="#efe9dc"/><rect x="120" y="118" width="84.6" height="22" rx="11" fill="#f2c14e" stroke="#2b2118" stroke-width="1.2"/><text x="124" y="158" font-size="12" fill="#6b6155" text-anchor="start" font-weight="400" dominant-baseline="central">one move deep, with the game's own hints: fast, and no plan</text><text x="108" y="187" font-size="14" fill="#2b2118" text-anchor="end" font-weight="600" dominant-baseline="central">minimax</text><rect x="120" y="176" width="470" height="22" rx="11" fill="#efe9dc"/><rect x="120" y="176" width="291.4" height="22" rx="11" fill="#7fcf7f" stroke="#2b2118" stroke-width="1.2"/><text x="124" y="216" font-size="12" fill="#6b6155" text-anchor="start" font-weight="400" dominant-baseline="central">every line a few moves deep, alpha-beta cutting the hopeless ones</text><text x="108" y="245" font-size="14" fill="#2b2118" text-anchor="end" font-weight="600" dominant-baseline="central">mcts</text><rect x="120" y="234" width="470" height="22" rx="11" fill="#efe9dc"/><rect x="120" y="234" width="423" height="22" rx="11" fill="#4a7fd6" stroke="#2b2118" stroke-width="1.2"/><text x="124" y="274" font-size="12" fill="#6b6155" text-anchor="start" font-weight="400" dominant-baseline="central">thousands of random finishes, spent on the moves that look best</text><text x="355" y="40" font-size="13" fill="#6b6155" text-anchor="middle" font-weight="600" dominant-baseline="central">how much of the game it looks at before moving</text></svg>
