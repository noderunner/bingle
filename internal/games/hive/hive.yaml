# yaml-language-server: $schema=../../../docs/game-definition.schema.json
id: hive
name: Hive
description: "John Yianni's insect tile game with the Mosquito, Ladybug and Pillbug expansions: no board, just a hive that grows as you place and move your tiles. Surround the enemy Queen Bee to win."
version: 0.1.0
designers: [John Yianni]
publisher: Gen42 Games
engine: ruleset
rules:
  - 'Each player has 14 tiles: 1 Queen Bee, 2 Beetles, 2 Spiders, 3 Grasshoppers, 3 Soldier Ants and the three expansion insects (1 Mosquito, 1 Ladybug, 1 Pillbug). A player wins when the enemy Queen Bee is surrounded on all six sides by tiles of either colour. If both Queens are surrounded by the same move, the game is drawn.'
  - "There is no board: tiles form one connected hive (the One Hive rule: you may never split it, even for a moment). White's first tile goes anywhere (the table is a large field behind the scenes, far wider than any hive grows; only the tiles are drawn). Black's first tile must touch it."
  - On your turn you must place a tile from your supply or move a tile already in the hive (if you can do neither, you pass). A newly placed tile may touch only your own tiles (looking at the top tile of a stack), except Black's first. Your Queen Bee must be placed by your fourth turn, and nothing may move until it is down.
  - "Freedom to move: a tile that slides must keep touching the hive and must be able to fit through: it cannot slide between two tiles that are both next to its path, nor squeeze into a gap too narrow for it (a stack that stands too high blocks a Beetle's climb in the same way)."
  - 'Queen Bee: 1 space. Beetle: 1 space, and it may climb on top of the hive and cover other tiles (the covered tile cannot move; the stack takes the colour of the tile on top). Spider: exactly 3 spaces, no going back. Soldier Ant: any number of spaces around the hive. Grasshopper: jumps in a straight line over one or more tiles to the first empty space.'
  - "Mosquito (expansion): moves like any kind of tile it touches when it moves (not another Mosquito); on top of the hive it moves like a Beetle. Next to a Pillbug it can use the Pillbug's throw as well."
  - 'Ladybug (expansion): moves exactly 3 spaces: two over the top of the hive, then down onto an empty space.'
  - 'Pillbug (expansion): moves 1 space, or instead throws a lone tile that touches it (either colour): the tile is lifted over the Pillbug onto an empty space that touches the Pillbug. It may not throw the tile that was moved by the previous move, a covered tile, or a tile whose lifting would split the hive; the Pillbug itself may not be covered, and freedom to move applies to the lift and the drop.'
  - "Interpretations: the game is a draw after 300 plies, or after two passes in a row. A placed tile is not 'moved' for the Pillbug's restriction. A Beetle or Mosquito may be placed anywhere any tile may."
params: {max_plies: 300}
board:
  generator: {type: hexhex, size: 10}
  style: free
seats:
  - {seat: 1, color: white, label: White}
  - {seat: 2, color: black, label: Black}
reserves:
  queen: 1
  beetle: 2
  spider: 2
  grasshopper: 3
  ant: 3
  mosquito: 1
  ladybug: 1
  pillbug: 1
pieces:
  queen:
    label: Queen Bee
    rules: Moves 1 space by sliding. If all six sides are filled, you lose. Must be placed by your fourth turn, and nothing may move until it is down.
    code: Q
    shape: bug-queen
  beetle:
    label: Beetle
    rules: Moves 1 space, and may climb on top of the hive, covering the tile below. A covered tile cannot move, and the stack belongs to the colour on top.
    code: B
    shape: bug-beetle
  spider:
    label: Spider
    rules: Moves exactly 3 spaces by sliding around the outside of the hive, never doubling back over a space it has passed.
    code: S
    shape: bug-spider
  grasshopper:
    label: Grasshopper
    rules: Jumps in a straight line over one or more tiles and lands on the first empty space. It ignores freedom to move.
    code: G
    shape: bug-grasshopper
  ant:
    label: Soldier Ant
    rules: Slides any number of spaces around the outside of the hive. The strongest tile for reaching open spaces.
    code: A
    shape: bug-ant
  mosquito:
    label: Mosquito
    rules: Moves like any tile it touches when it moves (not another Mosquito). On top of the hive it can only move like a Beetle. Next to a Pillbug it may use its throw.
    code: M
    shape: bug-mosquito
  ladybug:
    label: Ladybug
    rules: 'Moves exactly 3 spaces: 2 on top of the hive, then 1 down onto an empty space.'
    code: L
    shape: bug-ladybug
  pillbug:
    label: Pillbug
    rules: Moves 1 space by sliding, or instead throws an adjacent unstacked tile (not the one just moved) over itself to an empty space beside it.
    code: P
    shape: bug-pillbug
turn_order:
  type: round-robin
  seats: [1, 2]
win_condition: {type: ruleset}
display:
  tints:
    last:
      label: Last move
      color: '#c8dfa8'
      text: Where the last tile came from and where it went.
    danger:
      label: Queen in danger
      color: '#e8a898'
      text: A Queen Bee with four or more tiles around it.
variants:
  - id: hive-base
    name: Hive (without expansions)
    patch:
      reserves: {mosquito: 0, ladybug: 0, pillbug: 0}
guide:
  tabs:
    - {id: overview, title: Rules, file: guide/overview.md}
    - {id: pieces, title: Tiles, file: guide/pieces.md}
    - {id: moving, title: Moving & notation, file: guide/moving.md}
