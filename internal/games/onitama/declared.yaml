# yaml-language-server: $schema=../../../docs/game-definition.schema.json
# Onitama declared (ADRs 0119, 0120), step 1 of converting the Go ruleset
# (docs/dsl.md, "Converting a Go ruleset"): only declared_test.go compiles
# this, and plays it against the ruleset with tests/difftest. The server
# still plays rules.go.
id: onitama
name: Onitama
description: 'A two-player martial-arts game on a 5×5 board: five Move cards decide how your pieces may move, and the card you use is passed on to your opponent.'
version: 0.1.2
designers: [Shimpei Sato]
publisher: Arcane Wonders
rules:
  - 'Each player has a Master and four students on opposite home ranks, the Master on the Temple Arch (the middle square, c1 for Red and c5 for Blue). Sixteen Move cards exist; five are dealt at random: two to each player, face up, and one to the side. Red always starts (the printed game lets the stamp on the side card decide).'
  - Win by capturing your opponent's Master (the Way of the Stone), or by moving your own Master onto your opponent's Temple Arch (the Way of the Stream).
  - On your turn choose one of your two cards and move one of your pieces as the card shows (the black square is the piece, the coloured squares where it may go; Blue's cards are read upside down). Pieces may jump over others; you may not move off the board or onto your own piece. Landing on an enemy piece captures it.
  - 'Then swap: the card you used goes to the side, and you take the card that was waiting there. You may use it from your next turn.'
  - You must move if you can. If no card lets you move any piece, you pass, but you still choose a card and exchange it.
guide:
  tabs:
    - {id: rules, title: Rules, file: rules.md}
    - {id: cards, title: Cards, file: cards.md}
board:
  generator: {type: grid, width: 5, height: 5, adjacency: orthogonal8, labels: algebraic}
  style: squares
  regions:
    arch-red: [c1]
    arch-blue: [c5]
seats:
  - {seat: 1, color: red, label: Red, forward: N}
  - {seat: 2, color: blue, label: Blue, forward: S}
pieces:
  master: {label: Master, code: M, shape: king}
  student: {label: Student, code: S, shape: pawn}
setup:
  - {position: a1, piece: student, color: red}
  - {position: b1, piece: student, color: red}
  - {position: c1, piece: master, color: red}
  - {position: d1, piece: student, color: red}
  - {position: e1, piece: student, color: red}
  - {position: a5, piece: student, color: blue}
  - {position: b5, piece: student, color: blue}
  - {position: c5, piece: master, color: blue}
  - {position: d5, piece: student, color: blue}
  - {position: e5, piece: student, color: blue}
cards:
  decks:
    move:
      # A card's moves are [right, forward] from the piece, as its holder sees
      # the board; its tag is the colour of its stamp.
      extra:
        - {id: tiger, label: Tiger, moves: [[0, 2], [0, -1]], tags: [blue]}
        - {id: dragon, label: Dragon, moves: [[-2, 1], [2, 1], [-1, -1], [1, -1]], tags: [red]}
        - {id: frog, label: Frog, moves: [[-2, 0], [-1, 1], [1, -1]], tags: [red]}
        - {id: rabbit, label: Rabbit, moves: [[2, 0], [1, 1], [-1, -1]], tags: [blue]}
        - {id: crab, label: Crab, moves: [[0, 1], [-2, 0], [2, 0]], tags: [blue]}
        - {id: elephant, label: Elephant, moves: [[-1, 1], [1, 1], [-1, 0], [1, 0]], tags: [red]}
        - {id: goose, label: Goose, moves: [[-1, 1], [-1, 0], [1, 0], [1, -1]], tags: [blue]}
        - {id: rooster, label: Rooster, moves: [[1, 1], [1, 0], [-1, 0], [-1, -1]], tags: [red]}
        - {id: monkey, label: Monkey, moves: [[-1, 1], [1, 1], [-1, -1], [1, -1]], tags: [blue]}
        - {id: mantis, label: Mantis, moves: [[-1, 1], [1, 1], [0, -1]], tags: [red]}
        - {id: horse, label: Horse, moves: [[0, 1], [-1, 0], [0, -1]], tags: [red]}
        - {id: ox, label: Ox, moves: [[0, 1], [1, 0], [0, -1]], tags: [blue]}
        - {id: crane, label: Crane, moves: [[0, 1], [-1, -1], [1, -1]], tags: [blue]}
        - {id: boar, label: Boar, moves: [[0, 1], [-1, 0], [1, 0]], tags: [red]}
        - {id: eel, label: Eel, moves: [[-1, 1], [-1, -1], [1, 0]], tags: [blue]}
        - {id: cobra, label: Cobra, moves: [[-1, 0], [1, 1], [1, -1]], tags: [red]}
  zones:
    - {id: box, label: Unused cards, scope: table, visibility: all, pile: true, counts: true}
    - {id: hand, label: Cards, scope: seat, visibility: all}
    - {id: side, label: Side card, scope: table, visibility: all}
# Five of the sixteen cards: two to each player and one to the side.
deal:
  - {shuffle: box}
  - {from: box, to: hand, each: 2, face: up}
  - {from: box, to: side, count: 1, face: up}
turn_order:
  type: round-robin
  seats: [1, 2]
actions:
  - {id: move, type: card-move, label: Move, hand: hand, pieces: [master, student], pass_on: side, stuck: spend}
win_condition:
  type: rules
  rules:
    # The Way of the Stone: capture the other Master.
    - {id: stone-red, type: absent, piece: master, of_seat: 2, seat: 1, reason: stone}
    - {id: stone-blue, type: absent, piece: master, of_seat: 1, seat: 2, reason: stone}
    # The Way of the Stream: your Master on the other Temple Arch.
    - {id: stream-red, type: reach, region: arch-blue, piece: master, seat: 1, reason: stream}
    - {id: stream-blue, type: reach, region: arch-red, piece: master, seat: 2, reason: stream}
    - {id: limit, type: end, when: [ply-limit], plies: 300, decide: {type: draw}, reason: ply-limit}
display:
  tints:
    arch-red:
      label: Red's Temple Arch
      color: '#e3a39a'
      text: Blue's Master wins by reaching this square.
    arch-blue:
      label: Blue's Temple Arch
      color: '#9fb6e0'
      text: Red's Master wins by reaching this square.
