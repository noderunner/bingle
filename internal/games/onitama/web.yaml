# How the web page draws Onitama (ADR 0124). The rules are in the definition; nothing
# here changes them, and other clients draw the game their own way.
board:
  style: squares
pieces:
  master: {shape: king}
  student: {shape: pawn}
display:
  no_hands: true
  tints:
    arch-red: {color: '#e3a39a'}
    arch-blue: {color: '#9fb6e0'}
    last: {color: '#b9d6a0'}
script: page.js
style: page.css
