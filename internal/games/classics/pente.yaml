# yaml-language-server: $schema=../../../docs/game-definition.schema.json
id: pente
name: Pente
description: Five in a row wins — or capture five pairs. Flank two enemy stones between your own and they are removed.
version: 0.3.0
designers: [Gary Gabrel]
rules:
  - Players alternate placing a stone on any empty intersection; the first player moves first.
  - Make a row of five (or more) of your stones, in any direction, to win.
  - 'Capture: when you place a stone so that exactly two adjacent enemy stones in a straight line are flanked by it and another stone of yours, both are removed. Placing a stone between two enemy stones is safe.'
  - Capturing five pairs (ten stones) also wins.
  - 'Optional (chosen when the game is made): with the pie rule, the second player may swap sides on their first turn instead of replying; the players change seats and the opening move changes hands with them.'
guide:
  tabs:
    - {id: rules, title: Rules, file: rules.md}
preview:
  - {position: g7, piece: stone, color: black}
  - {position: h8, piece: stone, color: black}
  - {position: i9, piece: stone, color: black}
  - {position: g9, piece: stone, color: black}
  - {position: j7, piece: stone, color: black}
  - {position: e5, piece: stone, color: black}
  - {position: k10, piece: stone, color: black}
  - {position: f8, piece: stone, color: black}
  - {position: h7, piece: stone, color: white}
  - {position: g8, piece: stone, color: white}
  - {position: i8, piece: stone, color: white}
  - {position: h9, piece: stone, color: white}
  - {position: f7, piece: stone, color: white}
  - {position: e7, piece: stone, color: white}
  - {position: j10, piece: stone, color: white}
  - {position: d6, piece: stone, color: white}
board:
  generator: {type: grid, width: 13, height: 13, adjacency: orthogonal8, labels: algebraic}
  style: points
seats:
  - {seat: 1, color: black, label: Black}
  - {seat: 2, color: white, label: White}
pieces:
  stone: {label: Stone, shape: disc}
reserves: {captured: 0}
pie_rule: optional
turn_order:
  type: round-robin
  seats: [1, 2]
actions:
  - id: place
    type: place
    label: Place a stone
    pieces: [stone]
    source: supply
    custodian:
      lengths: [2]
      count_in: captured
win_condition:
  type: rules
  rules:
    - {id: five, type: line, length: 5, reason: five-in-a-row}
    - {id: captures, type: pool, pool: captured, at_least: 10, reason: captures}
    - id: full
      type: end
      when: [board-full]
      decide: {type: draw}
      reason: draw
