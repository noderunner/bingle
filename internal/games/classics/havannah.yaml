# yaml-language-server: $schema=../../../docs/game-definition.schema.json
id: havannah-8
name: Havannah (base 8)
description: Win with a ring, a bridge between two corners or a fork touching three sides — on a hexagonal board. A connection game with three ways to win.
version: 0.3.2
designers: [Christian Freeling]
rules:
  - White and Black alternate placing one stone on any empty cell of the hexagonal board; White moves first.
  - A ring is a closed loop of your stones enclosing at least one cell (empty or not).
  - A bridge is a connected group of your stones touching two of the board's six corners.
  - A fork is a connected group of your stones touching three of the board's six sides (the corners are not part of a side).
  - The first player to make a ring, a bridge or a fork wins. If the board fills up first, the game is a draw.
  - 'Optional (chosen when the game is made): with the pie rule, the second player may swap sides on their first turn instead of replying; the players change seats and the opening move changes hands with them.'
guide:
  tabs:
    - {id: rules, title: Rules, file: rules.md}
board:
  generator: {type: hexhex, size: 8}
seats:
  - {seat: 1, color: white, label: White}
  - {seat: 2, color: black, label: Black}
pieces:
  piece: {label: Stone}
pie_rule: optional
turn_order:
  type: round-robin
  seats: [1, 2]
actions:
  - id: place
    type: place
    label: Place a stone
    pieces: [piece]
    source: supply
win_condition:
  type: rules
  rules:
    - {id: ring, type: ring, reason: ring}
    - id: bridge
      type: connect
      of: [corner-0, corner-1, corner-2, corner-3, corner-4, corner-5]
      touch: 2
      reason: bridge
    - id: fork
      type: connect
      of: [top, bottom, upper-left, lower-left, upper-right, lower-right]
      touch: 3
      reason: fork
    - id: full
      type: end
      when: [board-full]
      decide: {type: draw}
      reason: draw
variants:
  - id: havannah-4
    name: Havannah (base 4)
    patch:
      board:
        generator: {size: 4}
  - id: havannah-6
    name: Havannah (base 6)
    patch:
      board:
        generator: {size: 6}
  - id: havannah-10
    name: Havannah (base 10)
    patch:
      board:
        generator: {size: 10}
