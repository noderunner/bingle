# yaml-language-server: $schema=../../../docs/game-definition.schema.json
id: breakthrough
name: Breakthrough
description: Race a pawn across the board. Move straight or diagonally forward, capture only diagonally.
version: 0.1.0
designers: [Dan Troyka]
rules:
  - Each player starts with sixteen pawns on their two home rows; White moves first.
  - A pawn moves one square straight ahead or diagonally ahead onto an empty square, and may capture an enemy pawn on a diagonally-ahead square. It may not capture straight ahead.
  - The first player to move a pawn onto the opponent's home row wins. A player with no pieces left (or no legal move) loses.
guide:
  tabs:
    - {id: rules, title: Rules, file: rules.md}
board:
  generator: {type: grid, width: 8, height: 8, adjacency: orthogonal8, labels: algebraic}
  style: squares
seats:
  - {seat: 1, color: white, label: White, forward: N}
  - {seat: 2, color: black, label: Black, forward: S}
pieces:
  pawn: {label: Pawn, code: P, shape: disc}
setup:
  - {position: a2, piece: pawn, color: white}
  - {position: b2, piece: pawn, color: white}
  - {position: c2, piece: pawn, color: white}
  - {position: d2, piece: pawn, color: white}
  - {position: e2, piece: pawn, color: white}
  - {position: f2, piece: pawn, color: white}
  - {position: g2, piece: pawn, color: white}
  - {position: h2, piece: pawn, color: white}
  - {position: a1, piece: pawn, color: white}
  - {position: b1, piece: pawn, color: white}
  - {position: c1, piece: pawn, color: white}
  - {position: d1, piece: pawn, color: white}
  - {position: e1, piece: pawn, color: white}
  - {position: f1, piece: pawn, color: white}
  - {position: g1, piece: pawn, color: white}
  - {position: h1, piece: pawn, color: white}
  - {position: a8, piece: pawn, color: black}
  - {position: b8, piece: pawn, color: black}
  - {position: c8, piece: pawn, color: black}
  - {position: d8, piece: pawn, color: black}
  - {position: e8, piece: pawn, color: black}
  - {position: f8, piece: pawn, color: black}
  - {position: g8, piece: pawn, color: black}
  - {position: h8, piece: pawn, color: black}
  - {position: a7, piece: pawn, color: black}
  - {position: b7, piece: pawn, color: black}
  - {position: c7, piece: pawn, color: black}
  - {position: d7, piece: pawn, color: black}
  - {position: e7, piece: pawn, color: black}
  - {position: f7, piece: pawn, color: black}
  - {position: g7, piece: pawn, color: black}
  - {position: h7, piece: pawn, color: black}
turn_order:
  type: round-robin
  seats: [1, 2]
actions:
  - id: advance
    type: step
    label: Advance
    pieces: [pawn]
    directions: [forward]
    occupancy: empty-only
  - id: diagonal
    type: step
    label: Move or capture diagonally
    pieces: [pawn]
    directions: [forward-left, forward-right]
    occupancy: capture-or-empty
win_condition:
  type: rules
  rules:
    - {id: white, type: reach, seat: 1, region: top, reason: breakthrough}
    - {id: black, type: reach, seat: 2, region: bottom, reason: breakthrough}
    - id: stuck
      type: end
      when: [no-legal-moves]
      decide: {type: mover-wins}
      reason: no-moves
