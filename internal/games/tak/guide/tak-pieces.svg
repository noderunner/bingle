<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 190" width="560" height="190" role="img" aria-label="The three kinds of Tak stone" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><rect width="560" height="190" rx="10" fill="#f7f0df"/><rect x="18" y="12" width="164" height="166" rx="8" fill="#ecdcb2" stroke="#b9a57a" stroke-width="1"/><rect x="45.4" y="37.4" width="49.2" height="49.2" rx="6" fill="#f8f4ea" stroke="#3a3631" stroke-width="2"/><rect x="105.4" y="37.4" width="49.2" height="49.2" rx="6" fill="#2e2d33" stroke="#0d0d10" stroke-width="2"/><text x="100" y="112" font-size="13" fill="#2b2118" text-anchor="middle" font-weight="700" dominant-baseline="central">Flat stone</text><text x="100" y="134" font-size="11.5" fill="#2b2118" text-anchor="middle" font-weight="500" dominant-baseline="central">Lies flat.</text><text x="100" y="152" font-size="11.5" fill="#2b2118" text-anchor="middle" font-weight="500" dominant-baseline="central">Counts for roads.</text><rect x="198" y="12" width="164" height="166" rx="8" fill="#ecdcb2" stroke="#b9a57a" stroke-width="1"/><rect x="239.8" y="34.4" width="20.4" height="55.2" rx="4.2" fill="#f8f4ea" stroke="#3a3631" stroke-width="2"/><rect x="299.8" y="34.4" width="20.4" height="55.2" rx="4.2" fill="#2e2d33" stroke="#0d0d10" stroke-width="2"/><text x="280" y="112" font-size="13" fill="#2b2118" text-anchor="middle" font-weight="700" dominant-baseline="central">Standing stone (wall)</text><text x="280" y="134" font-size="11.5" fill="#2b2118" text-anchor="middle" font-weight="500" dominant-baseline="central">Blocks.</text><text x="280" y="152" font-size="11.5" fill="#2b2118" text-anchor="middle" font-weight="500" dominant-baseline="central">Counts for no road.</text><rect x="378" y="12" width="164" height="166" rx="8" fill="#ecdcb2" stroke="#b9a57a" stroke-width="1"/><circle cx="430" cy="62" r="25.8" fill="#f8f4ea" stroke="#3a3631" stroke-width="2"/><circle cx="430" cy="62" r="12.6" fill="none" stroke="#3a3631" stroke-width="2"/><circle cx="490" cy="62" r="25.8" fill="#2e2d33" stroke="#0d0d10" stroke-width="2"/><circle cx="490" cy="62" r="12.6" fill="none" stroke="#0d0d10" stroke-width="2"/><text x="460" y="112" font-size="13" fill="#2b2118" text-anchor="middle" font-weight="700" dominant-baseline="central">Capstone</text><text x="460" y="134" font-size="11.5" fill="#2b2118" text-anchor="middle" font-weight="500" dominant-baseline="central">Counts for roads.</text><text x="460" y="152" font-size="11.5" fill="#2b2118" text-anchor="middle" font-weight="500" dominant-baseline="central">Flattens walls.</text></svg>
