<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 386" width="560" height="386" role="img" aria-label="Walls and the capstone" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><rect width="560" height="386" rx="10" fill="#f7f0df"/><text x="280" y="22" font-size="14" fill="#2b2118" text-anchor="middle" font-weight="700" dominant-baseline="central">A flat stone cannot be moved onto a wall</text><rect x="138" y="34" width="268" height="76" rx="6" fill="#8a6a43"/><rect x="144" y="40" width="64" height="64" rx="0" fill="#ecdcb2" stroke="#b9a57a" stroke-width="1"/><rect x="208" y="40" width="64" height="64" rx="0" fill="#ecdcb2" stroke="#b9a57a" stroke-width="1"/><rect x="272" y="40" width="64" height="64" rx="0" fill="#ecdcb2" stroke="#b9a57a" stroke-width="1"/><rect x="336" y="40" width="64" height="64" rx="0" fill="#ecdcb2" stroke="#b9a57a" stroke-width="1"/><rect x="154.9" y="89.5" width="42.2" height="11" rx="3" fill="#f8f4ea" stroke="#3a3631" stroke-width="2"/><rect x="234" y="71" width="12" height="30" rx="3" fill="#2e2d33" stroke="#0d0d10" stroke-width="2"/><line x1="195.2" y1="72" x2="214.9" y2="72" stroke="#e0584a" stroke-width="3" stroke-linecap="round"/><polygon points="222.1,72 214,75.9 214,68.1" fill="#e0584a" stroke="#e0584a" stroke-width="1" stroke-linejoin="round"/><path d="M225.9 57.9L254.1 86.1M225.9 86.1L254.1 57.9" fill="none" stroke="#e0584a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="280" y="138" font-size="12.5" fill="#2b2118" text-anchor="middle" font-weight="700" dominant-baseline="central">but the capstone can flatten it, moving alone as the last step of its move</text><text x="38" y="196" font-size="12" fill="#2b2118" text-anchor="middle" font-weight="700" dominant-baseline="central">Before</text><text x="38" y="290" font-size="12" fill="#2b2118" text-anchor="middle" font-weight="700" dominant-baseline="central">After</text><rect x="72" y="158" width="268" height="76" rx="6" fill="#8a6a43"/><rect x="78" y="164" width="64" height="64" rx="0" fill="#ecdcb2" stroke="#b9a57a" stroke-width="1"/><rect x="142" y="164" width="64" height="64" rx="0" fill="#ecdcb2" stroke="#b9a57a" stroke-width="1"/><rect x="206" y="164" width="64" height="64" rx="0" fill="#ecdcb2" stroke="#b9a57a" stroke-width="1"/><rect x="270" y="164" width="64" height="64" rx="0" fill="#ecdcb2" stroke="#b9a57a" stroke-width="1"/><circle cx="110" cy="216" r="11" fill="#f8f4ea" stroke="#3a3631" stroke-width="2"/><circle cx="110" cy="216" r="4.5" fill="none" stroke="#3a3631" stroke-width="1.8"/><rect x="168" y="195" width="12" height="30" rx="3" fill="#2e2d33" stroke="#0d0d10" stroke-width="2"/><rect x="216.9" y="213.5" width="42.2" height="11" rx="3" fill="#2e2d33" stroke="#0d0d10" stroke-width="2"/><line x1="129.2" y1="196" x2="148.9" y2="196" stroke="#7fcf7f" stroke-width="3" stroke-linecap="round"/><polygon points="156.1,196 148,199.9 148,192.1" fill="#7fcf7f" stroke="#7fcf7f" stroke-width="1" stroke-linejoin="round"/><rect x="72" y="252" width="268" height="76" rx="6" fill="#8a6a43"/><rect x="78" y="258" width="64" height="64" rx="0" fill="#ecdcb2" stroke="#b9a57a" stroke-width="1"/><rect x="142" y="258" width="64" height="64" rx="0" fill="#ecdcb2" stroke="#b9a57a" stroke-width="1"/><rect x="206" y="258" width="64" height="64" rx="0" fill="#ecdcb2" stroke="#b9a57a" stroke-width="1"/><rect x="270" y="258" width="64" height="64" rx="0" fill="#ecdcb2" stroke="#b9a57a" stroke-width="1"/><rect x="152.9" y="307.5" width="42.2" height="11" rx="3" fill="#2e2d33" stroke="#0d0d10" stroke-width="2"/><circle cx="174" cy="297.5" r="11" fill="#f8f4ea" stroke="#3a3631" stroke-width="2"/><circle cx="174" cy="297.5" r="4.5" fill="none" stroke="#3a3631" stroke-width="1.8"/><rect x="216.9" y="307.5" width="42.2" height="11" rx="3" fill="#2e2d33" stroke="#0d0d10" stroke-width="2"/><text x="350" y="188" font-size="11.5" fill="#6a5a40" text-anchor="start" font-weight="500" dominant-baseline="central">The wall lies down and</text><text x="350" y="204" font-size="11.5" fill="#6a5a40" text-anchor="start" font-weight="500" dominant-baseline="central">becomes a flat stone,</text><text x="350" y="220" font-size="11.5" fill="#6a5a40" text-anchor="start" font-weight="500" dominant-baseline="central">with the capstone on top.</text><text x="280" y="346" font-size="12" fill="#2b2118" text-anchor="middle" font-weight="500" dominant-baseline="central">Nothing can be put or moved on top of a capstone.</text><text x="280" y="364" font-size="12" fill="#2b2118" text-anchor="middle" font-weight="500" dominant-baseline="central">A stack topped by a wall or a capstone can still be picked up and moved.</text></svg>
