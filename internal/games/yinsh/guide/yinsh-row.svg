<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 240" width="470" height="240" role="img" aria-label="Yinsh: a row of five" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><rect width="470" height="240" rx="10" fill="#f7f0df"/><rect x="14" y="14" width="442" height="212" rx="8" fill="#ecdcb2" stroke="#b9a57a" stroke-width="1"/><text x="235" y="34" font-size="14" fill="#2b2118" text-anchor="middle" font-weight="700" dominant-baseline="central">Making a row of five</text><line x1="54" y1="92" x2="406" y2="92" stroke="#5a4326" stroke-width="3" stroke-linecap="round"/><circle cx="54" cy="92" r="4" fill="#5a4326"/><circle cx="98" cy="92" r="4" fill="#5a4326"/><circle cx="142" cy="92" r="4" fill="#5a4326"/><circle cx="186" cy="92" r="4" fill="#5a4326"/><circle cx="230" cy="92" r="4" fill="#5a4326"/><circle cx="274" cy="92" r="4" fill="#5a4326"/><circle cx="318" cy="92" r="4" fill="#5a4326"/><circle cx="362" cy="92" r="4" fill="#5a4326"/><circle cx="406" cy="92" r="4" fill="#5a4326"/><circle cx="98" cy="92" r="7.5" fill="#f8f4ea" stroke="#3a3631" stroke-width="2"/><circle cx="142" cy="92" r="7.5" fill="#f8f4ea" stroke="#3a3631" stroke-width="2"/><circle cx="186" cy="92" r="7.5" fill="#f8f4ea" stroke="#3a3631" stroke-width="2"/><circle cx="230" cy="92" r="7.5" fill="#f8f4ea" stroke="#3a3631" stroke-width="2"/><circle cx="274" cy="92" r="7.5" fill="#f8f4ea" stroke="#3a3631" stroke-width="2"/><circle cx="54" cy="92" r="7.5" fill="#2e2d33" stroke="#0d0d10" stroke-width="2"/><circle cx="362" cy="92" r="15.2" fill="none" stroke="#3a3631" stroke-width="7.6"/><circle cx="362" cy="92" r="15.2" fill="none" stroke="#f8f4ea" stroke-width="4.6"/><rect x="78" y="72" width="216" height="40" rx="10" fill="none" stroke="#e8a317" stroke-width="3"/><text x="235" y="146" font-size="12" fill="#2b2118" text-anchor="middle" font-weight="500" dominant-baseline="central">Five markers of one colour in a row are removed, and you also</text><text x="235" y="162" font-size="12" fill="#2b2118" text-anchor="middle" font-weight="500" dominant-baseline="central">take one of your rings off the board: that ring is your score.</text></svg>
