<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 330" width="470" height="330" role="img" aria-label="Yinsh: moving a ring" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><rect width="470" height="330" rx="10" fill="#f7f0df"/><rect x="14" y="14" width="442" height="302" rx="8" fill="#ecdcb2" stroke="#b9a57a" stroke-width="1"/><text x="235" y="34" font-size="14" fill="#2b2118" text-anchor="middle" font-weight="700" dominant-baseline="central">Moving a ring along a line</text><text x="30" y="128" font-size="11.5" fill="#2b2118" text-anchor="start" font-weight="700" dominant-baseline="central">Before</text><line x1="54" y1="100" x2="406" y2="100" stroke="#5a4326" stroke-width="3" stroke-linecap="round"/><circle cx="54" cy="100" r="4" fill="#5a4326"/><circle cx="98" cy="100" r="4" fill="#5a4326"/><circle cx="142" cy="100" r="4" fill="#5a4326"/><circle cx="186" cy="100" r="4" fill="#5a4326"/><circle cx="230" cy="100" r="4" fill="#5a4326"/><circle cx="274" cy="100" r="4" fill="#5a4326"/><circle cx="318" cy="100" r="4" fill="#5a4326"/><circle cx="362" cy="100" r="4" fill="#5a4326"/><circle cx="406" cy="100" r="4" fill="#5a4326"/><circle cx="142" cy="100" r="7.5" fill="#2e2d33" stroke="#0d0d10" stroke-width="2"/><circle cx="186" cy="100" r="7.5" fill="#f8f4ea" stroke="#3a3631" stroke-width="2"/><circle cx="230" cy="100" r="7.5" fill="#2e2d33" stroke="#0d0d10" stroke-width="2"/><circle cx="54" cy="100" r="15.2" fill="none" stroke="#3a3631" stroke-width="7.6"/><circle cx="54" cy="100" r="15.2" fill="none" stroke="#f8f4ea" stroke-width="4.6"/><line x1="54" y1="74" x2="266.8" y2="74" stroke="#7fcf7f" stroke-width="3" stroke-linecap="round"/><polygon points="274,74 265.9,77.9 265.9,70.1" fill="#7fcf7f" stroke="#7fcf7f" stroke-width="1" stroke-linejoin="round"/><text x="164" y="62" font-size="11" fill="#6a5a40" text-anchor="middle" font-weight="500" dominant-baseline="central">the ring jumps the whole group</text><text x="30" y="218" font-size="11.5" fill="#2b2118" text-anchor="start" font-weight="700" dominant-baseline="central">After</text><line x1="54" y1="190" x2="406" y2="190" stroke="#5a4326" stroke-width="3" stroke-linecap="round"/><circle cx="54" cy="190" r="4" fill="#5a4326"/><circle cx="98" cy="190" r="4" fill="#5a4326"/><circle cx="142" cy="190" r="4" fill="#5a4326"/><circle cx="186" cy="190" r="4" fill="#5a4326"/><circle cx="230" cy="190" r="4" fill="#5a4326"/><circle cx="274" cy="190" r="4" fill="#5a4326"/><circle cx="318" cy="190" r="4" fill="#5a4326"/><circle cx="362" cy="190" r="4" fill="#5a4326"/><circle cx="406" cy="190" r="4" fill="#5a4326"/><circle cx="54" cy="190" r="7.5" fill="#f8f4ea" stroke="#3a3631" stroke-width="2"/><circle cx="142" cy="190" r="7.5" fill="#f8f4ea" stroke="#3a3631" stroke-width="2"/><circle cx="186" cy="190" r="7.5" fill="#2e2d33" stroke="#0d0d10" stroke-width="2"/><circle cx="230" cy="190" r="7.5" fill="#f8f4ea" stroke="#3a3631" stroke-width="2"/><circle cx="274" cy="190" r="15.2" fill="none" stroke="#3a3631" stroke-width="7.6"/><circle cx="274" cy="190" r="15.2" fill="none" stroke="#f8f4ea" stroke-width="4.6"/><text x="235" y="232" font-size="12" fill="#2b2118" text-anchor="middle" font-weight="500" dominant-baseline="central">A marker of your colour is dropped in the ring first. The ring</text><text x="235" y="248" font-size="12" fill="#2b2118" text-anchor="middle" font-weight="500" dominant-baseline="central">then moves in a straight line and lands on the first empty</text><text x="235" y="264" font-size="12" fill="#2b2118" text-anchor="middle" font-weight="500" dominant-baseline="central">point after the markers it jumped; every marker it jumped</text><text x="235" y="280" font-size="12" fill="#2b2118" text-anchor="middle" font-weight="500" dominant-baseline="central">changes colour.</text></svg>
