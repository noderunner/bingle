# How the web page draws Yinsh (ADR 0124). The rules are in the definition; nothing
# here changes them, and other clients draw the game their own way.
pieces:
  ring: {shape: donut}
  marker: {shape: chip}
display:
  no_hands: true
  tints:
    last: {color: '#c8dfa8'}
    flipped: {color: '#f0d98a'}
    row: {color: '#e8a898'}
# A game in play, for the list of games and the setup page.
preview:
  - {position: c4, piece: ring, color: white}
  - {position: e7, piece: ring, color: white}
  - {position: g6, piece: ring, color: white}
  - {position: f3, piece: ring, color: white}
  - {position: d6, piece: ring, color: white}
  - {position: e4, piece: ring, color: black}
  - {position: g5, piece: ring, color: black}
  - {position: i8, piece: ring, color: black}
  - {position: d4, piece: ring, color: black}
  - {position: f8, piece: ring, color: black}
  - {position: e5, piece: marker, color: white}
  - {position: f5, piece: marker, color: white}
  - {position: d5, piece: marker, color: black}
  - {position: f6, piece: marker, color: black}
