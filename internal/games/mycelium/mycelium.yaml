# yaml-language-server: $schema=../../../docs/game-definition.schema.json
id: mycelium
name: Mycelium
description: "Two fungal colonies on a hexagonal board: place nodes, take the centre to start a confluence, and spread your clusters to convert your rival's nodes until one colony is gone."
version: 0.1.0
designers: [Miles Stevenson]
engine: ruleset
rules:
  - Mycelium is played on a size-5 hex-hex board (61 cells). Player 1 plays black nodes and player 2 green nodes; Black places first, on an empty board.
  - On a normal turn a player places one node of their colour on any empty cell. A node placed on the centre cell (e5) starts a confluence.
  - A cluster is a connected group of nodes of one colour. A spore cluster touches no enemy node; a hyphae cluster touches at least one. A strand is a path of a cluster's nodes, each touching the next, which may bend.
  - 'A confluence has two phases: first the spore clusters spread, then the hyphae clusters. In each phase the clusters spread in initiative order: the clusters of size 1 first, then size 2, and so on.'
  - Within an initiative step, the player who did not take the centre chooses first, and the players alternate, each spreading one of their eligible clusters, until neither has one left; a player with none left lets the other continue.
  - 'A spore spread: choose a node of the cluster and a straight line from it across empty cells; the first enemy node on that line becomes your colour. The spreading node stays where it is.'
  - 'A hyphae spread: choose the end of a strand and convert an enemy node it touches, then optionally an enemy node touching that one, and so on, as many as the strand has nodes. The converted nodes may wind in any direction.'
  - Each cluster spreads at most once in a phase. A cluster formed by conversion that holds no node of a cluster that has spread may spread too, if the initiative has not yet passed its size.
  - When neither phase has anything left to spread, the node on the centre is removed. A player with no nodes left loses; if neither player has any, the player who took the centre loses. Otherwise the player who did not take the centre places next.
  - The game is drawn if 500 plies are played without a confluence deciding it.
params: {max_plies: 500}
guide:
  tabs:
    - {id: rules, title: Rules, file: rules.md}
preview:
  - {position: e5, piece: black, color: black}
  - {position: d5, piece: green, color: green}
  - {position: f5, piece: green, color: green}
  - {position: e4, piece: green, color: green}
  - {position: e6, piece: green, color: green}
  - {position: d4, piece: black, color: black}
  - {position: f6, piece: black, color: black}
board:
  generator: {type: hexhex, size: 5}
seats:
  - {seat: 1, color: black, label: Black}
  - {seat: 2, color: green, label: Green}
pieces:
  black: {label: Black node, code: B, shape: disc, color: black}
  green: {label: Green node, code: G, shape: disc, color: green}
turn_order:
  type: round-robin
  seats: [1, 2]
win_condition: {type: ruleset}
display:
  no_hands: true
  tints:
    last:
      label: Last placement
      color: '#c8dfa8'
      text: The node placed on the last normal turn.
    spent:
      label: Has spread
      color: '#e0d0a0'
      text: A node of a cluster that has spread in this phase of the confluence.
    confluence:
      label: Confluence
      color: '#d8b8e8'
      text: 'The centre during a confluence: its node is removed when the confluence ends.'
