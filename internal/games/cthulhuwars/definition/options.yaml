# Part of cthulhuwars.yaml, included by name.
- id: factions
  label: Factions
  kind: seat-choice
  text: Which cult sits in each seat. The seats are the players of the table; no cult can be chosen twice.
  choices:
    - id: gc
      label: Great Cthulhu
      color: green
      text: Deep Ones, Shoggoths, Star Spawn and Cthulhu.
    - id: cc
      label: Crawling Chaos
      color: blue
      text: 'Nightgaunts, Flying Polyps, Hunting Horrors and Nyarlathotep: everything flies.'
    - id: bg
      label: Black Goat
      color: red
      text: Ghouls, Fungi, Dark Young and Shub-Niggurath.
    - id: ys
      label: Yellow Sign
      color: yellow
      text: Undead, Byakhee, the King in Yellow and Hastur.
    - id: ww
      label: Windwalker
      color: white
      text: 'Expansion: Wendigos, Gnoph-Keh, Rhan-Tegoth and Ithaqua. Needs the polar areas.'
    - id: sl
      label: Sleeper
      color: orange
      text: 'Expansion: Wizards, Serpent Men, Formless Spawn and Tsathoggua.'
    - id: ow
      label: Opener of the Way
      color: purple
      text: 'Expansion: Mutants, Abominations, Spawn of Yog-Sothoth and Yog-Sothoth, who is a Gate himself; moves Gates.'
    - id: tt
      label: Tcho-Tcho
      color: brown
      text: 'Expansion: High Priests, Proto-Shoggoths and Ubbo-Sathla, whose Growth counter feeds on the Doom phases.'
    - id: an
      label: The Ancients
      color: teal
      text: 'Expansion: Un-Men, Reanimated and Yothans, and no Great Old One at all. Builds Cathedrals and leans on its enemies.'
    - id: bu
      label: Bubastis
      color: sand
      text: 'Expansion: Earth Cats and Cats from Mars, Saturn and Uranus, with Bastet. No Cultists: the Moon is its Gate, and every cat gives Power.'
  default: [gc, cc, bg, ys, ww]
- id: faction-pool
  label: Factions the table chooses from
  kind: multi-choice
  text: More factions than seats, with those in factions among them. In the lobby the players choose from these alone, their own seats included. It needs a lobby to mean anything.
  choices:
    - {id: gc, label: Great Cthulhu}
    - {id: cc, label: Crawling Chaos}
    - {id: bg, label: Black Goat}
    - {id: ys, label: Yellow Sign}
    - {id: ww, label: Windwalker}
    - {id: sl, label: Sleeper}
    - {id: ow, label: Opener of the Way}
    - {id: tt, label: Tcho-Tcho}
    - {id: an, label: The Ancients}
    - {id: bu, label: Bubastis}
- id: high-priests
  label: High Priests
  kind: bool
  default: false
  text: 'The expansion: every cult has one High Priest, a Cultist that is recruited for 3 Power, gives 1 Power, can hold a Gate — and can be sacrificed for 2 Power (Unspeakable Oath).'
- id: azathoth
  label: Azathoth (neutral spellbooks and Monsters)
  kind: bool
  default: false
  text: The neutral content of the Azathoth faction. Any cult may take one of the six neutral spellbooks (Shriveling, Stars Are Right, Recriminations, The Mao Ceremony, Umr at-Tawil, Undimensioned) in place of one of its own, and may buy the Loyalty Card of a neutral Monster (Dimensional Shambler, Star Vampire, Elder Thing, Servitor of the Outer Gods) for 2 Doom in the Doom phase.
- id: dreamlands
  label: Dreamlands Surface Monsters
  kind: bool
  default: false
  text: 'Three neutral Monsters whose Loyalty Cards are bought with 2 Doom in the Doom phase: the Moonbeast (lies on an enemy spellbook), the Gnorri (extra Doom for two or three in play) and the Shantak (moves anywhere and carries a Cultist).'
- id: beyond
  label: Beyond Time and Space
  kind: bool
  default: false
  text: Two neutral Monsters, the Wamp (an enemy places them where there is no Gate) and the Voonith (makes up Kills), and a Terror, the Hound of Tindalos, whose card costs 2 Doom and 2 Power.
- id: underworld
  label: "Dreamlands Underworld Monsters"
  kind: bool
  default: false
  text: "Ghasts that swarm to your Gates, Leng Spiders that turn Pains into Kills, and Gugs that hit hard but cannot capture."
- id: cosmic-terrors
  label: "Cosmic Terrors"
  kind: bool
  default: false
  text: "Three Terrors at 2 Doom and 2 Power: the Great Race of Yith (captures any Cultist), the Dhole (pays out when it falls) and Quachil Uttaus (turns enemy dead to dust)."
- id: cats
  label: "Something About Cats"
  kind: bool
  default: false
  text: "The Cats from Mercury and Venus, the Asteroid Cat (chooses an enemys next spellbook) and a Terror, the Cat from Neptune (one last Ritual)."
- id: satyr
  label: "Satyr (Ramsey Campbell Horrors 2)"
  kind: bool
  default: false
  text: "A neutral Monster that brings an Acolyte of your pool each time it is summoned."
- id: neutral-units
  label: Neutral Monsters and Terrors, one by one
  kind: multi-choice
  text: Individual Loyalty Cards to put in the game, whatever pack they come from. A pack option brings all of its own besides these.
  choices:
    - {id: dimensional-shambler, label: Dimensional Shambler}
    - {id: star-vampire, label: Star Vampire}
    - {id: elder-thing, label: Elder Thing}
    - {id: servitor, label: Servitor of the Outer Gods}
    - {id: moonbeast, label: Moonbeast}
    - {id: gnorri, label: Gnorri}
    - {id: shantak, label: Shantak}
    - {id: wamp, label: Wamp}
    - {id: voonith, label: Voonith}
    - {id: hound-of-tindalos, label: Hound of Tindalos}
    - {id: ghast, label: Ghast}
    - {id: leng-spider, label: Leng Spider}
    - {id: gug, label: Gug}
    - {id: great-race-of-yith, label: Great Race of Yith}
    - {id: dhole, label: Dhole}
    - {id: quachil-uttaus, label: Quachil Uttaus}
    - {id: cat-from-mercury, label: Cat from Mercury}
    - {id: cat-from-venus, label: Cat from Venus}
    - {id: asteroid-cat, label: Asteroid Cat}
    - {id: cat-from-neptune, label: Cat from Neptune}
    - {id: satyr, label: Satyr}
- id: neutral-books
  label: Neutral spellbooks, one by one
  kind: multi-choice
  text: Individual neutral spellbooks any cult may take in place of one of its own. The Azathoth option brings all six.
  choices:
    - {id: shrivel, label: Shriveling}
    - {id: stars, label: Stars Are Right}
    - {id: recrim, label: Recriminations}
    - {id: mao, label: The Mao Ceremony}
    - {id: umr, label: Umr at-Tawil}
    - {id: undim, label: Undimensioned}
- id: igoo-abhoth
  label: 'Independent: Abhoth (Great Old One Pack 1)'
  kind: bool
  default: false
  text: An Independent Great Old One any cult may awaken (a Gate it controls in an area with one of its Great Old Ones). Filth Tokens as meat shields and a spellbook that spoils the others' Gates. For a first game use one Independent fewer than there are players.
- id: igoo-chaugnar
  label: 'Independent: Chaugnar Faugn (Great Old One Pack 1)'
  kind: bool
  default: false
  text: An Independent Great Old One any cult may awaken (a Gate it controls in an area with one of its Great Old Ones). +3 dice in battles at your Gates, and a spellbook that lets you choose the Elder Signs others receive. For a first game use one Independent fewer than there are players.
- id: igoo-cthugha
  label: 'Independent: Cthugha (Great Old One Pack 1)'
  kind: bool
  default: false
  text: An Independent Great Old One any cult may awaken (a Gate it controls in an area with one of its Great Old Ones). Replaces one of your Great Old Ones; spares the Units he Kills for Power. For a first game use one Independent fewer than there are players.
- id: igoo-hydra
  label: 'Independent: Mother Hydra (Great Old One Pack 1)'
  kind: bool
  default: false
  text: An Independent Great Old One any cult may awaken (a Gate it controls in an area with one of its Great Old Ones). Drives Cultists out of an ocean, and a spellbook that places all your Acolytes at once. For a first game use one Independent fewer than there are players.
- id: igoo-yig
  label: 'Independent: Yig (Great Old One Pack 1)'
  kind: bool
  default: false
  text: An Independent Great Old One any cult may awaken (a Gate it controls in an area with one of its Great Old Ones). Poisons your Cultists, and a spellbook that makes the others pay you Power or Doom. For a first game use one Independent fewer than there are players.
- id: igoo-atlach
  label: "Independent: Atlach-Nacha (Great Old One Pack 2)"
  kind: bool
  default: false
  text: "An Independent Great Old One any cult may awaken (a Gate it controls in an area with one of its Great Old Ones). Spins Webs: with six on the map, her spellbook wins the game outright."
- id: igoo-bokrug
  label: "Independent: Bokrug (Great Old One Pack 2)"
  kind: bool
  default: false
  text: "An Independent Great Old One any cult may awaken (a Gate it controls in an area with one of its Great Old Ones). Comes back after a Doom phase when killed; hand him to an enemy to curse them with his spellbook."
- id: igoo-dagon
  label: "Independent: Father Dagon (Great Old One Pack 2)"
  kind: bool
  default: false
  text: "An Independent Great Old One any cult may awaken (a Gate it controls in an area with one of its Great Old Ones). 6 dice in an ocean; washes every Cultist out of a coastal area."
- id: igoo-ghatanothoa
  label: "Independent: Ghatanothoa (Great Old One Pack 2)"
  kind: bool
  default: false
  text: "An Independent Great Old One any cult may awaken (a Gate it controls in an area with one of its Great Old Ones). Mummifies enemy Acolytes: they cannot move or fight and give no Power."
- id: igoo-gobogeg
  label: "Independent: Gobogeg (Great Old One Pack 3)"
  kind: bool
  default: false
  text: "An Independent Great Old One any cult may awaken (a Gate it controls in an area with one of its Great Old Ones). Free once a player has six spellbooks; every awakening then pays 6 Power, and he Pains the whole area when struck."
- id: igoo-byatis
  label: "Independent: Byatis (Great Old One Pack 4)"
  kind: bool
  default: false
  text: "An Independent Great Old One any cult may awaken (a Gate it controls in an area with one of its Great Old Ones). Cannot move; earns an Elder Sign alone in his area and pulls enemy Cultists in."
- id: igoo-nyogtha
  label: "Independent: Nyogtha (Great Old One Pack 4)"
  kind: bool
  default: false
  text: "An Independent Great Old One any cult may awaken (a Gate it controls in an area with one of its Great Old Ones). Two figures with 4 dice each when they declare the battle, and 1 when they do not."
- id: igoo-tulzscha
  label: "Independent: Tulzscha (Great Old One Pack 4)"
  kind: bool
  default: false
  text: "An Independent Great Old One any cult may awaken (a Gate it controls in an area with one of its Great Old Ones). Catches up: 1 Doom, 1 Elder Sign and 1 Power when someone has more."
- id: igoo-glaaki
  label: "Independent: Gla'aki (Ramsey Campbell Horrors 1)"
  kind: bool
  default: false
  text: "An Independent Great Old One any cult may awaken (a Gate it controls in an area with one of its Great Old Ones). Feeds on the Acolytes in your pool, in Power and in dice."
- id: igoo-daoloth
  label: "Independent: Daoloth (Ramsey Campbell Horrors 2)"
  kind: bool
  default: false
  text: "An Independent Great Old One any cult may awaken (a Gate it controls in an area with one of its Great Old Ones). Silences the strongest enemy Great Old One in a battle; opens Gates where it goes."
- id: igoo-ygolonac
  label: "Independent: Y'Golonac (Ramsey Campbell Horrors 2)"
  kind: bool
  default: false
  text: "An Independent Great Old One any cult may awaken (a Gate it controls in an area with one of its Great Old Ones). Cheap, and when killed he bursts out of the enemy, card and all."
- id: igoo-hagarg
  label: "Independent: Hagarg Ryonis (Something About Cats)"
  kind: bool
  default: false
  text: "An Independent Great Old One any cult may awaken (a Gate it controls in an area with one of its Great Old Ones). An Elder God who adds 3 Pains instead of dice and robs a Ritual of an Elder Sign."
- id: book-swaps
  label: Neutral spellbook instead of a timer book
  kind: book-swap
  text: Ghroth (Black Goat) and The Thousand Forms (Crawling Chaos) need a clock, which is awkward when the turns are days apart. Replace the book with one of the six neutral spellbooks — even without the Azathoth option; each neutral spellbook can replace one book only.
  slots:
    - id: bg
      label: Ghroth
      recommended: undim
      text: 'Black Goat: the action that gives its enemies a minute to decide who loses Cultists.'
    - id: cc
      label: The Thousand Forms
      recommended: stars
      text: 'Crawling Chaos: the negotiation over how much Power the others pay.'
  choices:
    - id: shrivel
      label: Shriveling
      text: 'Pre-Battle: eliminate an enemy Monster or Cultist in the battle; its owner gets Power equal to its cost.'
    - id: stars
      label: Stars Are Right
      text: 'Ongoing: revealing Elder Signs in the Doom phase also gives Power equal to their value.'
    - id: recrim
      label: Recriminations
      text: 'Action (1 Power): set aside any spellbook of yours and take another available one.'
    - id: mao
      label: The Mao Ceremony
      text: 'Ongoing: after Gather Power sacrifice any number of your Cultists for 1 Power each.'
    - {id: umr, label: Umr at-Tawil, text: 'Ongoing: Gates cost you 2 Power.'}
    - id: undim
      label: Undimensioned
      text: 'Action (2 Power): rearrange your units among the areas where you already have some.'
