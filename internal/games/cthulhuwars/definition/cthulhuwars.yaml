  tints:
    ocean:
      label: Ocean
      color: '#b9d3e6'
      text: "Ocean areas: Great Cthulhu's Submerge, Y'ha-Nthlei and gate requirements refer to them."
    land: {label: Land, color: '#e5dcc0', text: Land areas.}
    desecrated:
      label: Desecrated
      color: '#d8c76a'
      text: A Desecration token lies here (Yellow Sign).
  badges:
    gate-0:
      label: Abandoned Gate
      color: '#8d8776'
      glyph: ◌
      text: 'A Gate nobody controls: it still gives 1 Power to every player in Gather Power. A unit that arrives takes it, and so does a unit of yours already there — select it, then click the Gate.'
    gate-1:
      label: Gate (Great Cthulhu)
      color: '#3c9a4a'
      glyph: ◉
      text: 'A Gate controlled by Great Cthulhu. The figure on it is the unit that occupies it, apart from the others of its kind there: click yours to move it — that abandons the Gate.'
    gate-2:
      label: Gate (Crawling Chaos)
      color: '#2f6fb5'
      glyph: ◉
      text: 'A Gate controlled by Crawling Chaos. The figure on it is the unit that occupies it, apart from the others of its kind there: click yours to move it — that abandons the Gate.'
    gate-3:
      label: Gate (Black Goat)
      color: '#b3342b'
      glyph: ◉
      text: 'A Gate controlled by Black Goat. The figure on it is the unit that occupies it, apart from the others of its kind there: click yours to move it — that abandons the Gate.'
    gate-4:
