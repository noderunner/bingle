      color: '#d8c76a'
      glyph: ✠
      text: A Desecration token (Yellow Sign).
    target:
      label: Battle
      color: '#d1453b'
      glyph: ✕
      text: The area where a battle is being fought.
    gate-5:
      label: Gate (Windwalker)
      color: '#7f9bb0'
      glyph: ◉
      text: 'A Gate controlled by Windwalker. The figure on it is the unit that occupies it, apart from the others of its kind there: click yours to move it — that abandons the Gate.'
    iceage:
      label: Ice Age
      color: '#8fc3e6'
      glyph: ❄
      text: "Windwalker's Ice Age token: enemy Actions that end here cost 1 Power more."
