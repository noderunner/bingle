# yaml-language-server: $schema=../../../../docs/game-definition.schema.json
id: cthulhu-wars
name: Cthulhu Wars (4 players, 5-3 map)
family: cthulhu-wars
description: 'Three to five rival cults fight to wake their Great Old Ones and open the most gates: spend Power on recruiting, moving, summoning and battling over a simplified world map, earn spellbooks, and be first past 30 Doom with all six books. Six cults to choose from — Great Cthulhu, Crawling Chaos, Black Goat, Yellow Sign, Windwalker and Sleeper — and the High Priests as an optional expansion.'
version: 0.1.0
designers: [Sandy Petersen]
publisher: Petersen Games
engine: ruleset
rules:
  - 'Cthulhu Wars is a game of three to five cults — Great Cthulhu, Crawling Chaos, Black Goat, Yellow Sign and, from the first expansion, Windwalker and Sleeper — racing to open Gates, awaken their Great Old Ones and gain Doom. Each round: everyone spends Power on actions, gathers new Power from cultists and Gates, and then scores Doom for the Gates they control (and may perform a Ritual of Annihilation).'
  - The first player to reach 30 Doom ends the game at the end of that Doom phase; the player with the most Doom and all six spellbooks wins. If nobody has all six spellbooks, humanity wins and every cult loses.
  - 'Open the Guide tabs in this window for the full rules: the round, every action, battles, the factions and their spellbooks, the High Priests, the neutral cards (neutral spellbooks, Monsters and Terrors with Loyalty Cards), the Independent Great Old Ones and the map.'
params:
  doom_to_win: 30
  start_power: 8
  gate_cost: 3
  elder_signs: [18, 12, 6]
  starts: {gc: south-pacific, cc: asia, bg: south-america-west, ys: europe}
  sigils:
    ww: [arctic-ocean, antarctica]
    sl: [north-america-west]
board: !include board.yaml
seats:
  - {seat: 1, color: green, label: Great Cthulhu}
  - {seat: 2, color: blue, label: Crawling Chaos}
  - {seat: 3, color: red, label: Black Goat}
  - {seat: 4, color: yellow, label: Yellow Sign}
pieces: !include pieces.yaml
