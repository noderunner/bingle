# yaml-language-server: $schema=../../../../docs/tutorial.schema.json
id: movement
kind: rules
title: Movement
summary: Moving on the map, moving several units at once, and why a move starts no battle.
order: 4
game: cthulhu-wars
seat: 1          # you play Great Cthulhu; the page plays the others
start: !include positions/units-to-move.yaml

steps:
  - text: |
      **Move** is one action. Each unit you move goes to an adjacent area and costs **1 Power**.
      Your units in the South Pacific can reach any of the highlighted areas.
    highlight: [antarctica, indian-ocean, new-zealand, north-pacific, south-america-west, south-atlantic]
    spotlight: [power]

  - text: |
      Click a **Deep One** in the South Pacific, then click **Antarctica**, then press **Done**.
    play: [go:deep-one@south-pacific>antarctica, done]
    hint: Click a Deep One on the map, click Antarctica, then press Done.
    arrow: [south-pacific, antarctica]
    reply: [recruit@asia]

  - text: |
      **One Move action can move many units.** Each one costs 1 Power and can move only once.

      Click your other **Deep One**, then your **Shoggoth**. They gather in the card with your actions.
      Then click **New Zealand**, and press **Done**.
    play: [go:deep-one@south-pacific>new-zealand, go:shoggoth@south-pacific>new-zealand, done]
    hint: Click the Deep One and the Shoggoth, click New Zealand, then press Done.
    arrow: [south-pacific, new-zealand]
    spotlight: [impulse, power]
    reply: [recruit@asia]

  - text: |
      Your units now stand in New Zealand with Black Goat's, and **nothing happened**. Moving into
      an enemy's area never starts a battle.

      **Battle is an action of its own**, with its own cost. It waits for your next turn, so your
      enemy can answer first.
    highlight: [new-zealand]
    spotlight: [actions]

  - text: |
      **A move can gather units from several areas, and send them to several.** One Move action
      moves as many of your units as you can pay for, each into an area next to its own.

      Click the **Deep One in Antarctica** and the **Shoggoth in New Zealand**: both border the
      **Indian Ocean**, so click it and they go there together. Then click the **Deep One in New
      Zealand**, click **Australia**, and press **Done**. That is one action for 3 Power.
    play: [go:deep-one@antarctica>indian-ocean, go:shoggoth@new-zealand>indian-ocean, go:deep-one@new-zealand>australia, done]
    hint: Click the Deep One in Antarctica and the Shoggoth in New Zealand, click the Indian Ocean; then the Deep One in New Zealand, Australia, and Done.
    arrow: [new-zealand, indian-ocean]
    spotlight: [impulse, power]

  - text: |
      Moving costs 1 Power a unit, goes one area, and starts no fight. One Move can take units from
      many areas into one, or from one area into many, and each unit moves once.
