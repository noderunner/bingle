name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt check
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "$fmt_out"
            echo "gofmt found unformatted files (run 'make fmt')"
            exit 1
          fi
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: build
        run: go build ./...
      # The runner image ships Google Chrome, which the browser-driven tests in tests/app use.
      - name: test
        # The slowest package (the bot batches) takes 7-10 minutes on a shared runner, close to go test's default
        # limit of 10 per package, so the limit is set to what the job (30 minutes) can bear.
        run: go test -timeout 25m ./...
      - name: smoke test
        run: ./scripts/smoke-test.sh

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: build container image
        run: docker build -t bingle:ci -f Containerfile .
      - name: run and smoke-test container
        run: |
          docker run -d --name bingle-ci -p 18080:8080 bingle:ci
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18080/healthz; then
              exit 0
            fi
            sleep 0.5
          done
          echo "container never became healthy"
          docker logs bingle-ci
          exit 1
